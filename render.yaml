services:
  - type: web
    name: puffin-quest
    runtime: node
    plan: free
    rootDir: webapp
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # The database now lives on Neon, outside Render, so this value is set by
      # hand in the Render dashboard (Environment tab) rather than wired to a
      # Render database. See docs/DATABASE_BACKUP_AND_MIGRATION.md.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
