services:
  - type: web
    name: puffin-quest
    runtime: node
    plan: free
    rootDir: webapp
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: puffin-quest-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: puffin-quest-db
    plan: free
